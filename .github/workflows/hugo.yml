name: Deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: Deployment target
        required: true
        default: plesk
        type: choice
        options:
          - both
          - github
          - plesk
  workflow_run:
    workflows:
      - Update publication citations
    types:
      - completed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Manual runs use the selected input. Other triggers can be controlled with
  # the DEPLOY_MODE repository variable and default to deploying to Plesk.
  DEPLOY_MODE: ${{ inputs.deploy_mode || vars.DEPLOY_MODE || 'plesk' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        if: env.DEPLOY_MODE == 'both' || env.DEPLOY_MODE == 'plesk'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - name: Build site for Plesk
        if: env.DEPLOY_MODE == 'both' || env.DEPLOY_MODE == 'plesk'
        run: >
          hugo --minify
          --baseURL "https://aiclab.web.nitech.ac.jp/"
          --destination public-plesk

      - name: Publish generated site for Plesk
        if: env.DEPLOY_MODE == 'both' || env.DEPLOY_MODE == 'plesk'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: plesk-deploy
          publish_dir: ./public-plesk
          force_orphan: true

      - name: Prepare GitHub Pages redirect
        if: env.DEPLOY_MODE == 'both' || env.DEPLOY_MODE == 'github'
        run: |
          mkdir public-github
          cp github-pages-redirect/index.html public-github/index.html
          cp github-pages-redirect/index.html public-github/404.html

      - name: Upload GitHub Pages artifact
        if: env.DEPLOY_MODE == 'both' || env.DEPLOY_MODE == 'github'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-github

  deploy:
    if: (inputs.deploy_mode || vars.DEPLOY_MODE || 'plesk') == 'both' || (inputs.deploy_mode || vars.DEPLOY_MODE || 'plesk') == 'github'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
